# ============================================
# Pull Request Validation
# Runs on: All Pull Requests
# Purpose: Validate code before merge
# ============================================

name: PR Validation

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

jobs:
  validate:
    name: 🔍 Validate PR
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: 📊 PR Info
        run: |
          echo "📝 PR Title: ${{ github.event.pull_request.title }}"
          echo "👤 Author: ${{ github.event.pull_request.user.login }}"
          echo "🔀 Base: ${{ github.event.pull_request.base.ref }}"
          echo "🌿 Head: ${{ github.event.pull_request.head.ref }}"

      - name: 🏷️ Check PR title format
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if [[ ! $PR_TITLE =~ ^(feat|fix|docs|style|refactor|test|chore)(\(.+\))?:.+ ]]; then
            echo "❌ PR title must follow conventional commits format"
            echo "Examples: feat: add login, fix(api): resolve timeout"
            exit 1
          fi
          echo "✅ PR title format is valid"

      - name: 📏 Check PR size
        run: |
          FILES_CHANGED=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD | wc -l)
          LINES_CHANGED=$(git diff origin/${{ github.event.pull_request.base.ref }}...HEAD | wc -l)

          echo "📊 PR Statistics:"
          echo "  Files changed: $FILES_CHANGED"
          echo "  Lines changed: $LINES_CHANGED"

          if [ $FILES_CHANGED -gt 50 ]; then
            echo "⚠️ Large PR detected ($FILES_CHANGED files)"
            echo "Consider splitting into smaller PRs"
          fi

  backend-check:
    name: ✅ Backend Checks
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.title, 'backend') || contains(github.event.pull_request.labels.*.name, 'backend')

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 🏗️ Build
        working-directory: ./VoltX_Backend
        run: mvn clean compile --batch-mode

      - name: 🧪 Test
        working-directory: ./VoltX_Backend
        run: mvn test --batch-mode

  frontend-check:
    name: ✅ Frontend Checks
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.title, 'frontend') || contains(github.event.pull_request.labels.*.name, 'frontend')

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: VoltX_Frontend/package-lock.json

      - name: 📚 Install
        working-directory: ./VoltX_Frontend
        run: npm ci

      - name: 🔍 Lint
        working-directory: ./VoltX_Frontend
        run: npm run lint

      - name: 🏗️ Build
        working-directory: ./VoltX_Frontend
        run: npm run build

  security-check:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔍 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 📤 Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  auto-label:
    name: 🏷️ Auto Label
    runs-on: ubuntu-latest

    steps:
      - name: 🏷️ Label PR based on files changed
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  comment-summary:
    name: 💬 Add Summary Comment
    runs-on: ubuntu-latest
    needs: [validate, backend-check, frontend-check]
    if: always()

    steps:
      - name: 💬 Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `
            ## 🔍 PR Validation Summary

            | Check | Status |
            |-------|--------|
            | Validation | ${{ needs.validate.result == 'success' && '✅ Passed' || '❌ Failed' }} |
            | Backend | ${{ needs.backend-check.result == 'success' && '✅ Passed' || needs.backend-check.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |
            | Frontend | ${{ needs.frontend-check.result == 'success' && '✅ Passed' || needs.frontend-check.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |

            **Commit:** \`${{ github.event.pull_request.head.sha }}\`
            **Author:** @${{ github.event.pull_request.user.login }}

            ---
            *Automated check by VoltX CI/CD*
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
