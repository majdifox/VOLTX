# ============================================
# Complete CI/CD Pipeline
# Runs: Test → Build → Deploy
# Triggers on: Push to main
# ============================================

name: Complete CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  # Backend Testing
  backend-test:
    name: 🧪 Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: voltx_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 🧪 Run tests
        working-directory: ./VoltX_Backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/voltx_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: test_password
        run: mvn test --batch-mode

  # Frontend Build
  frontend-build:
    name: 🏗️ Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: VoltX_Frontend/package-lock.json

      - name: 📚 Install & Build
        working-directory: ./VoltX_Frontend
        run: |
          npm ci
          npm run lint
          npm run build

  # Docker Build & Push
  docker-build:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build & Push Backend
        uses: docker/build-push-action@v7
        with:
          context: ./VoltX_Backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build & Push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./VoltX_Frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Optional: Deploy to Production
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    # Only deploy on main branch
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Railway (Example)
        # Uncomment and configure when ready to deploy
        if: false
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Install Railway CLI
          npm i -g @railway/cli
          # Deploy
          railway up --service backend
          railway up --service frontend

      - name: 🚀 Deploy to Render (Example)
        # Uncomment and configure when ready to deploy
        if: false
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          # Trigger Render deployment via API
          curl -X POST \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json"

      - name: 🚀 Deploy via SSH (Example)
        # For VPS/DigitalOcean deployment
        if: false
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts

          # Deploy via SSH
          ssh $SERVER_USER@$SERVER_HOST << 'EOF'
            cd /var/www/voltx
            docker-compose pull
            docker-compose up -d
            docker image prune -f
          EOF

      - name: ✅ Deployment complete
        run: |
          echo "🎉 Deployment successful!"
          echo "📝 Check your application at: [YOUR_DEPLOYMENT_URL]"

  # Send notifications
  notify:
    name: 📢 Notify Status
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    steps:
      - name: 📧 Send email notification (Optional)
        if: false
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: VoltX Deployment ${{ job.status }}
          body: |
            Deployment finished with status: ${{ job.status }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
          to: your-email@example.com
          from: VoltX CI/CD

      - name: 💬 Discord notification (Optional)
        if: false
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"🚀 VoltX deployed successfully!\"}" \
            $DISCORD_WEBHOOK
