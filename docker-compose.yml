# ============================================
# VoltX Docker Compose Configuration
# Run entire app with: docker-compose up --build
# ============================================

version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: voltx-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: voltx_fil
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 15111964bmw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voltx-network

  # Spring Boot Backend
  backend:
    build:
      context: ./VoltX_Backend
      dockerfile: Dockerfile
    container_name: voltx-backend
    restart: unless-stopped
    environment:
      # Database connection (use service name 'database' instead of localhost)
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/voltx_fil
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 15111964bmw

      # JPA settings
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: false

      # Server settings
      SERVER_PORT: 8080

      # JWT settings (use existing from application.properties)
      JWT_SECRET: VoltX_S3cur3_JWT_S3cr3t_K3y_2024_Ch4ng3_In_Pr0duct10n_Pl34s3!
      JWT_ACCESS_TOKEN_EXPIRATION: 86400000
      JWT_REFRESH_TOKEN_EXPIRATION: 604800000

      # CORS (allow frontend)
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://frontend:80

      # File upload
      FILE_UPLOAD_DIR: ./uploads
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy
    networks:
      - voltx-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # React Frontend with Nginx
  frontend:
    build:
      context: ./VoltX_Frontend
      dockerfile: Dockerfile
    container_name: voltx-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - voltx-network

# Volumes for data persistence
volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

# Network for service communication
networks:
  voltx-network:
    driver: bridge
