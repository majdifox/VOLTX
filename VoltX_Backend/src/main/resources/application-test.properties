# ============================================
# Test Environment Configuration
# ============================================

# In-Memory Database for Tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true

# JPA Test Settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Test JWT Settings
jwt.secret=test-secret-key-for-unit-and-integration-tests-12345678901234567890
jwt.access-token-expiration=300000
jwt.refresh-token-expiration=900000

# CORS - Permissive for tests
app.cors.allowed-origins=*
app.cors.allow-credentials=false

# Rate Limiting - Disabled for tests
app.rate-limiting.enabled=false

# Logging - Minimal for tests
logging.level.com.voltx=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.web=WARN
logging.level.root=WARN

# Test specific logging
logging.level.org.springframework.test=INFO
logging.level.org.testcontainers=INFO

# File Upload - Test directory
file.upload-dir=test-uploads
file.max-file-size=1MB
file.max-request-size=5MB

# Email - Mock for tests
spring.mail.host=localhost
spring.mail.port=25
app.mail.enabled=false

# Redis - Embedded for tests
spring.redis.host=localhost
spring.redis.port=6370
spring.cache.type=none

# Actuator - Full exposure for testing
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Test Features
app.features.debug-mode=true
app.features.mock-external-apis=true
app.features.test-data-generation=true

# Database
app.database.seed-data=true
app.database.recreate-schema=true

# Async Processing - Synchronous for tests
spring.task.execution.pool.core-size=1
spring.task.execution.pool.max-size=1
spring.task.scheduling.pool.size=1

# Test Profiles
spring.test.database.replace=none
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# TestContainers
testcontainers.reuse.enable=true