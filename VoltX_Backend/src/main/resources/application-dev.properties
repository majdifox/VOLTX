# ============================================
# Development Environment Configuration
# ============================================

# Server
server.port=8080

# Development Database
spring.datasource.url=jdbc:postgresql://localhost:5432/voltx_dev
spring.datasource.username=voltx_dev
spring.datasource.password=dev_password

# JPA Development Settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true

# Development Security
jwt.secret=development-secret-key-not-for-production-use-only-12345678901234567890
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=86400000

# CORS - Allow all for development
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
app.cors.allow-credentials=true

# Rate Limiting - More lenient for development
app.rate-limiting.enabled=false
app.rate-limiting.requests-per-minute=1000

# Logging - More verbose for development
logging.level.com.voltx=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.web=DEBUG

# File Upload - Development directory
file.upload-dir=dev-uploads
file.max-file-size=50MB
file.max-request-size=100MB

# Email - Development settings (usually mock or Mailhog)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
app.mail.enabled=false

# Redis - Development instance
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=

# Actuator - Full exposure for development
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.configprops.show-values=always

# Development Features
app.features.debug-mode=true
app.features.mock-external-apis=true
app.features.test-data-generation=true

# Dev Database Seeding
app.database.seed-data=true
app.database.recreate-schema=true

# Cache - Disabled for development to see real-time changes
spring.cache.type=none

# Hot Reload Support
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true