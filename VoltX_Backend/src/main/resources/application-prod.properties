# ============================================
# Production Environment Configuration
# ============================================

# Server - Production optimizations
server.port=${SERVER_PORT:8080}
server.compression.enabled=true
server.compression.min-response-size=1KB
server.http2.enabled=true
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=${SSL_KEYSTORE_PATH}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12

# Production Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://db:5432/voltx_prod}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Connection Pool - Production optimized
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=120000

# JPA Production Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.caffeine.CaffeineRegionFactory

# Security - Production JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:1800000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

# CORS - Strict production settings
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://voltx.com,https://www.voltx.com,https://app.voltx.com}
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH
app.cors.allow-credentials=true

# Rate Limiting - Production limits
app.rate-limiting.enabled=true
app.rate-limiting.requests-per-minute=30
app.rate-limiting.requests-per-hour=500
app.rate-limiting.burst-capacity=5

# Logging - Production levels
logging.level.com.voltx=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.web=WARN
logging.level.web=WARN
logging.level.root=WARN

# Log Files
logging.file.name=${LOG_FILE_PATH:/var/log/voltx/application.log}
logging.file.max-size=100MB
logging.file.max-history=30
logging.file.total-size-cap=1GB

# File Upload - Production storage
file.upload-dir=${UPLOAD_DIR:/var/voltx/uploads}
file.max-file-size=10MB
file.max-request-size=20MB

# Email - Production SMTP
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@voltx.com}

# Redis - Production cluster
spring.redis.cluster.nodes=${REDIS_CLUSTER_NODES}
spring.redis.password=${REDIS_PASSWORD}
spring.redis.timeout=3000ms
spring.redis.lettuce.pool.max-active=20
spring.redis.lettuce.pool.max-idle=10
spring.redis.lettuce.pool.min-idle=5

# Actuator - Limited exposure for production
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=db,redis
management.endpoint.health.group.liveness.include=ping

# Metrics & Monitoring
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=production

# Security Headers
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Performance Tuning
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=500

# Cache - Production enabled
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=10000,expireAfterAccess=1h

# Production Features
app.features.debug-mode=false
app.features.mock-external-apis=false
app.features.test-data-generation=false

# Database
app.database.seed-data=false
app.database.recreate-schema=false

# External Services
app.external.payment-gateway.url=${PAYMENT_GATEWAY_URL}
app.external.payment-gateway.api-key=${PAYMENT_GATEWAY_API_KEY}
app.external.analytics.url=${ANALYTICS_URL}
app.external.analytics.api-key=${ANALYTICS_API_KEY}

# Backup Configuration
app.backup.enabled=true
app.backup.schedule=0 2 * * *
app.backup.retention-days=30
app.backup.s3.bucket=${BACKUP_S3_BUCKET}
app.backup.s3.region=${BACKUP_S3_REGION}

# Health Checks
app.health.disk-space.threshold=1GB
app.health.database.timeout=5s
app.health.redis.timeout=2s