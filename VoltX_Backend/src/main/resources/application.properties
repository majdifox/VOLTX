# ============================================
# VoltX Application Configuration
# ============================================

# Server Configuration
server.port=8080
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.http2.enabled=true
server.forward-headers-strategy=framework

# Application
spring.application.name=voltx
spring.profiles.active=@spring.profiles.active@

# ============================================
# Database Configuration
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/voltx
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.leak-detection-threshold=60000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false
spring.jpa.properties.hibernate.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.generate_statistics=false

# ============================================
# Security Configuration
# ============================================
# JWT
jwt.secret=${JWT_SECRET:voltx-secret-key-for-jwt-authentication-must-be-at-least-256-bits}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}
jwt.issuer=voltx-api
jwt.audience=voltx-app

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# Rate Limiting
app.rate-limiting.enabled=true
app.rate-limiting.requests-per-minute=60
app.rate-limiting.requests-per-hour=1000
app.rate-limiting.burst-capacity=10

# ============================================
# File Upload & Storage
# ============================================
file.upload-dir=${UPLOAD_DIR:uploads}
file.max-file-size=10MB
file.max-request-size=50MB
file.allowed-extensions=jpg,jpeg,png,gif,pdf,doc,docx,txt
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

# ============================================
# Caching Configuration
# ============================================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterAccess=10m

# Redis (if enabled)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=2000ms
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0

# ============================================
# Email Configuration
# ============================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.timeout=5000

# ============================================
# Monitoring & Actuator
# ============================================
management.endpoints.web.exposure.include=health,metrics,info,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=true
management.health.diskspace.enabled=true

# ============================================
# Logging Configuration
# ============================================
logging.level.com.voltx=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================
# Performance & Threading
# ============================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=voltx-async-

spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=voltx-scheduled-

# ============================================
# Validation & Serialization
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.fail-on-empty-beans=false

# ============================================
# Custom Application Properties
# ============================================
app.name=VoltX Extreme Sports Platform
app.version=@project.version@
app.description=Extreme sports adventure platform with real-time features
app.website=https://voltx.com
app.admin.email=${ADMIN_EMAIL:admin@voltx.com}

# API Configuration
app.api.version=v1
app.api.base-path=/api/${app.api.version}
app.api.docs.enabled=true
app.api.docs.path=/swagger-ui.html

# Business Logic
app.achievement.check-interval=PT1H
app.leaderboard.refresh-interval=PT5M
app.points.calculation.batch-size=100
app.notifications.max-per-user=50
app.session.timeout=PT30M

# Feature Flags
app.features.real-time-chat=true
app.features.push-notifications=true
app.features.advanced-analytics=true
app.features.social-sharing=true
app.features.achievement-system=true
