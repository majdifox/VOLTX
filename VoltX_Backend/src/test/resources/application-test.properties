# ============================================================
# Test profile — uses H2 in-memory database
# This file is loaded when @ActiveProfiles("test") is present
# ============================================================

# Use H2 in-memory database (no external DB needed)
spring.datasource.url=jdbc:h2:mem:voltx_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create the schema automatically from entities
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Disable WebSocket and other non-essential beans during testing
spring.main.allow-bean-definition-overriding=true

# JWT secret (any value works for tests — just needs to be long enough)
jwt.secret=test-secret-key-that-is-long-enough-for-hmac-256-algorithm-voltx
jwt.access-expiration=900000
jwt.refresh-expiration=604800000
